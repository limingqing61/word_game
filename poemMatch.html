<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📜</text></svg>">
    <title>不会做诗也会吟</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ===== 诗韵连线专用样式 ===== */
        .poem-container {
            display: flex;
            flex-direction: row;
            gap: 60px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
            padding-bottom: 10px;
        }

        .poem-column {
            display: flex;
            flex-direction: column;
            gap: 14px;
            min-width: 180px;
            flex: 1;
            max-width: 350px;
        }

        .poem-item {
            background: #fef7e0;
            border-radius: 16px;
            padding: 12px 16px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            box-shadow: 0 4px 0 #b97f44;
            border: 3px solid #4fc3f7;
            cursor: pointer;
            transition: 0.05s linear;
            font-size: 1.2rem;
            font-weight: bold;
            color: #31220e;
            user-select: none;
            font-family: 'Noto Serif SC', 'KaiTi', '楷体', serif;
        }

        .poem-item .poem-text {
            flex: 1;
            text-align: center;
        }

        .poem-item .speak-btn {
            background: #4fc3f7;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            flex-shrink: 0;
            font-size: 0.8rem;
            box-shadow: 0 2px 0 #0288d1;
            transition: 0.05s linear;
        }

        .poem-item .speak-btn:active {
            transform: translateY(2px);
            box-shadow: 0 0px 0 #0288d1;
        }

        .poem-item:hover {
            transform: translateY(-2px);
        }

        .poem-item.selected {
            border-color: #FF9800;
            background: #fff3e0;
        }

        .poem-item.matched {
            border-color: #4CAF50;
            background: #e8f5e9;
            pointer-events: none;
            opacity: 0.6;
        }

        .poem-item.wrong {
            border-color: #F44336;
            background: #ffebee;
            animation: shake 0.4s;
        }

        /* 五言和七言不同字号 */
        .poem-item.five-char {
            font-size: 1.1rem;
            padding: 10px 14px;
            min-height: 50px;
        }

        .poem-item.seven-char {
            font-size: 1.3rem;
            padding: 14px 18px;
            min-height: 60px;
        }

        .poem-item .poem-text .highlight-char {
            color: #ff6b6b;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-8px);
            }

            75% {
                transform: translateX(8px);
            }
        }

        /* ===== 计分板 ===== */
        .poem-score-board {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin: 10px 0 6px;
        }

        .poem-score-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .poem-score-label {
            font-size: 0.9rem;
            color: #ffecb3;
        }

        .poem-score-value {
            font-size: 1.6rem;
            font-weight: bold;
        }

        .poem-score-value.correct {
            color: #4CAF50;
        }

        .poem-score-value.wrong {
            color: #F44336;
        }

        .poem-score-value.score {
            color: #ffd966;
        }

        .poem-round-info {
            text-align: center;
            font-size: 1.2rem;
            color: #ffd966;
            margin: 6px 0 10px;
        }

        .poem-progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin-bottom: 12px;
            overflow: hidden;
        }

        .poem-progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ffd54f, #ff9800);
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        /* ===== 游戏结束 ===== */
        .poem-result-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 20000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .poem-result-card {
            background: linear-gradient(135deg, #fff9ef, #ffe0b3);
            border-radius: 60px;
            padding: 35px 45px;
            text-align: center;
            max-width: 380px;
            width: 85%;
            border: 4px solid #ffaa33;
        }

        .poem-result-card h2 {
            font-size: 2.2rem;
            margin: 0 0 10px;
            color: #31220e;
        }

        .poem-result-card .final-score {
            font-size: 2.8rem;
            font-weight: bold;
            color: #ff6b6b;
            margin: 5px 0;
        }

        .poem-result-card .final-label {
            font-size: 1.1rem;
            color: #5a4a2e;
        }

        .poem-result-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .poem-result-buttons button {
            border: none;
            padding: 10px 28px;
            font-size: 1rem;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 4px 0 #b97f44;
            transition: 0.05s linear;
        }

        .poem-result-buttons button:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #b97f44;
        }

        .poem-result-buttons .btn-restart {
            background: #4caf50;
            color: white;
            box-shadow: 0 4px 0 #2e7d32;
        }

        .poem-result-buttons .btn-home {
            background: #607d8b;
            color: white;
            box-shadow: 0 4px 0 #455a64;
        }

        /* ===== 底部返回 ===== */
        .poem-bottom-bar {
            text-align: center;
            margin-top: 14px;
        }

        .poem-bottom-bar .back-home-btn {
            background: #607d8b;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 4px 0 #455a64;
            transition: 0.05s linear;
        }

        .poem-bottom-bar .back-home-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #455a64;
        }

        /* ===== 启动遮罩 ===== */
        #startOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a472a 0%, #0e2a1a 100%);
            z-index: 100000;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
            text-align: center;
        }

        #startOverlay h1 {
            font-size: 2.5rem;
            text-shadow: 4px 4px 0 #b45309;
            margin-bottom: 6px;
        }

        #startOverlay .subtitle {
            font-size: 1.1rem;
            opacity: 0.8;
            margin-bottom: 20px;
        }

        .rule-box {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 30px;
            padding: 16px 24px;
            margin-bottom: 25px;
            max-width: 380px;
            width: 90%;
        }

        .rule-box p {
            margin: 6px 0;
            font-size: 0.95rem;
            opacity: 0.9;
        }

        .rule-box .highlight {
            color: #ffd54f;
            font-weight: bold;
        }

        #startBtn {
            background: #ffaa33;
            border: none;
            padding: 14px 44px;
            font-size: 1.4rem;
            border-radius: 60px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 0 #b97f44;
            font-family: inherit;
            transition: 0.05s linear;
            color: #31220e;
        }

        #startBtn:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #b97f44;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 700px) {
            .poem-container {
                flex-direction: column;
                align-items: center;
                gap: 20px;
            }

            .poem-column {
                min-width: 140px;
                max-width: 100%;
                width: 100%;
            }

            .poem-item {
                font-size: 1rem;
                padding: 10px 12px;
                min-height: 50px;
            }

            .poem-item.seven-char {
                font-size: 1.1rem;
                padding: 12px 14px;
                min-height: 55px;
            }

            .poem-item .speak-btn {
                width: 28px;
                height: 28px;
                font-size: 0.7rem;
            }

            .poem-score-board {
                gap: 20px;
            }

            .poem-score-value {
                font-size: 1.2rem;
            }

            #startOverlay h1 {
                font-size: 1.8rem;
            }

            #startBtn {
                font-size: 1.1rem;
                padding: 12px 32px;
            }
        }

        @media (max-width: 400px) {
            .poem-item {
                font-size: 0.85rem;
                padding: 8px 10px;
                min-height: 44px;
            }

            .poem-item.seven-char {
                font-size: 0.95rem;
                padding: 10px 12px;
                min-height: 48px;
            }

            .poem-item .speak-btn {
                width: 24px;
                height: 24px;
                font-size: 0.6rem;
            }
        }
    </style>
</head>

<body>

    <!-- ===== 启动遮罩 ===== -->
    <div id="startOverlay">
        <h1>📜 诗韵连线</h1>
        <div class="subtitle">Poem Match · Match the Verses</div>

        <div class="rule-box">
            <p>🎯 点击左边诗句，再点击右边对应的 <span class="highlight">下句</span></p>
            <p>📊 共 <span class="highlight">20 题</span></p>
            <p>⭐ 前 10 题每题 4 分，后 10 题每题 6 分</p>
            <p style="margin-top:8px; font-size:0.85rem;">💡 答错直接进入下一题</p>
        </div>

        <button id="startBtn">🔊 开始挑战</button>
    </div>

    <!-- ===== 游戏容器 ===== -->
    <div class="game-container" id="gameContainer" style="display: none;">
        <header>
            <h1>📜 不会做诗也会吟</h1>
            <p>Poem Match · Match the Verses</p>
        </header>

        <div class="poem-score-board">
            <div class="poem-score-item">
                <span class="poem-score-label">Correct:</span>
                <span id="correctCount" class="poem-score-value correct">0</span>
            </div>
            <div class="poem-score-item">
                <span class="poem-score-label">Wrong:</span>
                <span id="wrongCount" class="poem-score-value wrong">0</span>
            </div>
            <div class="poem-score-item">
                <span class="poem-score-label">Score:</span>
                <span id="totalScore" class="poem-score-value score">0</span>
            </div>
            <div class="poem-score-item">
                <span class="poem-score-label">Progress:</span>
                <span id="roundCount" class="poem-score-value">0/20</span>
            </div>
        </div>

        <div class="poem-progress-bar">
            <div id="progressFill" class="poem-progress-fill"></div>
        </div>

        <div id="roundInfo" class="poem-round-info">第 1 题 · 4 句五言</div>

        <div id="poemContainer" class="poem-container">
            <!-- 由 JavaScript 动态生成 -->
        </div>

        <div class="poem-bottom-bar">
            <button id="backHomeBtn" class="back-home-btn"><i class="fas fa-home"></i> 返回首页</button>
        </div>
    </div>

    <script src="utils.js"></script>
    <script src="poemData.js"></script>
    <script src="poemMatch.js"></script>
</body>

</html>
