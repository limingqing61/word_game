<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>夹缝求生 · Bouncing Ball</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        body {
            background: linear-gradient(145deg, #1a472a 0%, #0e2a1a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Comic Neue', 'Comic Sans MS', cursive, sans-serif;
            padding: 8px;
        }

        .game-container {
            max-width: 820px;
            width: 100%;
            height: 100%;
            background: rgba(30, 50, 30, 0.7);
            backdrop-filter: blur(5px);
            border-radius: 50px;
            padding: 10px 14px 14px;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            text-align: center;
            color: #FFE484;
            text-shadow: 4px 4px 0 #B45309;
            flex-shrink: 0;
        }

        header h1 {
            font-size: 1.5rem;
            margin: 0;
        }

        header p {
            font-size: 0.7rem;
            opacity: 0.9;
            margin: 0;
        }

        .top-panel {
            display: flex;
            justify-content: space-between;
            background: #31220e;
            padding: 3px 12px;
            border-radius: 40px;
            margin: 4px 0 6px;
            color: #ffecb3;
            font-weight: bold;
            font-size: 0.75rem;
            flex-shrink: 0;
        }

        .top-panel .best-box {
            cursor: pointer;
            color: #ffd966;
        }

        .canvas-wrapper {
            position: relative;
            flex: 1;
            background: #1a2a1a;
            border-radius: 20px;
            border: 3px solid #ffaa33;
            overflow: hidden;
            touch-action: none;
            min-height: 200px;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #1a2a1a;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        /* ===== 新增滑动条区域 ===== */
        .slider-wrapper {
            flex-shrink: 0;
            padding: 6px 12px 2px;
            touch-action: none;
        }

        #sliderTrack {
            position: relative;
            width: 100%;
            height: 24px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            border: 2px solid rgba(255, 170, 51, 0.3);
            touch-action: none;
            cursor: pointer;
        }

        #sliderHandle {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 60px;
            height: 30px;
            background: linear-gradient(145deg, #4fc3f7, #0288d1);
            border-radius: 30px;
            border: 2px solid #ffd54f;
            box-shadow: 0 0 15px rgba(79, 195, 247, 0.4);
            touch-action: none;
            cursor: grab;
            left: 0;
            transition: none;
        }

        #sliderHandle:active {
            cursor: grabbing;
        }

        /* 手柄上的小装饰 */
        #sliderHandle::after {
            content: "⇔";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            font-weight: bold;
        }

        .bottom-bar {
            text-align: center;
            margin-top: 4px;
            flex-shrink: 0;
        }

        .bottom-bar .back-home-btn {
            background: #607d8b;
            color: white;
            border: none;
            padding: 6px 18px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 3px 0 #455a64;
            transition: 0.05s linear;
            font-size: 0.85rem;
        }

        .bottom-bar .back-home-btn:active {
            transform: translateY(3px);
            box-shadow: 0 0px 0 #455a64;
        }

        /* ===== 启动遮罩 ===== */
        #startOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a472a 0%, #0e2a1a 100%);
            z-index: 100000;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
            text-align: center;
            padding: 20px;
        }

        #startOverlay h1 {
            font-size: 2.2rem;
            text-shadow: 4px 4px 0 #b45309;
            margin-bottom: 4px;
        }

        #startOverlay .subtitle {
            font-size: 1rem;
            opacity: 0.8;
            margin-bottom: 16px;
        }

        .rule-box {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 30px;
            padding: 12px 20px;
            margin-bottom: 20px;
            max-width: 380px;
            width: 90%;
        }

        .rule-box p {
            margin: 3px 0;
            font-size: 0.85rem;
            opacity: 0.9;
        }

        .rule-box .highlight {
            color: #ffd54f;
            font-weight: bold;
        }

        .rule-box .small {
            font-size: 0.7rem;
            opacity: 0.6;
        }

        #startBtn {
            background: #ffaa33;
            border: none;
            padding: 12px 40px;
            font-size: 1.3rem;
            border-radius: 60px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 0 #b97f44;
            font-family: inherit;
            transition: 0.05s linear;
            color: #31220e;
        }

        #startBtn:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #b97f44;
        }

        /* ===== 游戏结束浮层 ===== */
        .result-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 20000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .result-card {
            background: linear-gradient(135deg, #fff9ef, #ffe0b3);
            border-radius: 60px;
            padding: 30px 35px;
            text-align: center;
            max-width: 360px;
            width: 85%;
            border: 4px solid #ffaa33;
        }

        .result-card h2 {
            font-size: 2rem;
            margin: 0 0 6px;
            color: #31220e;
        }

        .result-card .final-time {
            font-size: 2.5rem;
            font-weight: bold;
            color: #ff6b6b;
            margin: 4px 0;
        }

        .result-card .final-label {
            font-size: 1rem;
            color: #5a4a2e;
        }

        .result-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .result-buttons button {
            border: none;
            padding: 8px 24px;
            font-size: 0.95rem;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 4px 0 #b97f44;
            transition: 0.05s linear;
        }

        .result-buttons button:active {
            transform: translateY(3px);
            box-shadow: 0 0px 0 #b97f44;
        }

        .result-buttons .btn-restart {
            background: #4caf50;
            color: white;
            box-shadow: 0 4px 0 #2e7d32;
        }

        .result-buttons .btn-home {
            background: #607d8b;
            color: white;
            box-shadow: 0 4px 0 #455a64;
        }

        @media (max-width: 600px) {
            body {
                padding: 4px;
            }

            .game-container {
                padding: 6px 8px 10px;
                border-radius: 30px;
            }

            header h1 {
                font-size: 1.1rem;
            }

            header p {
                font-size: 0.55rem;
            }

            .top-panel {
                font-size: 0.6rem;
                padding: 2px 8px;
                margin: 2px 0 4px;
            }

            .slider-wrapper {
                padding: 4px 6px 2px;
            }

            #sliderTrack {
                height: 20px;
            }

            #sliderHandle {
                height: 26px;
                width: 50px;
            }

            .bottom-bar .back-home-btn {
                font-size: 0.7rem;
                padding: 4px 12px;
            }

            #startOverlay h1 {
                font-size: 1.6rem;
            }

            #startBtn {
                font-size: 1rem;
                padding: 10px 28px;
            }

            .rule-box {
                padding: 8px 12px;
            }

            .rule-box p {
                font-size: 0.7rem;
            }

            .result-card {
                padding: 20px 18px;
            }

            .result-card h2 {
                font-size: 1.4rem;
            }

            .result-card .final-time {
                font-size: 1.8rem;
            }
        }

        @media (max-width: 400px) {
            .top-panel {
                font-size: 0.5rem;
                padding: 1px 6px;
            }

            header h1 {
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>

    <!-- ===== 启动遮罩 ===== -->
    <div id="startOverlay">
        <h1>🧱 夹缝求生</h1>
        <div class="subtitle">Bouncing Ball · Reflect or Inflect</div>

        <div class="rule-box">
            <p>🎯 用挡板接住小球，打掉所有砖块</p>
            <p>🖐️ 挡板 <span class="highlight">5段</span>，不同位置改变反弹角度</p>
            <p>💀 只有 <span class="highlight">1条命</span>，球落底即失败</p>
            <p class="small">⏱️ 记录通关总时间</p>
        </div>

        <button id="startBtn">🔊 开始挑战</button>
    </div>

    <!-- ===== 游戏容器 ===== -->
    <div class="game-container" id="gameContainer" style="display: none;">
        <header>
            <h1>🧱 夹缝求生</h1>
            <p>Bouncing Ball · Reflect or Inflect</p>
        </header>

        <div class="top-panel">
            <span>⏱️ 用时: <span id="timerDisplay">0</span>s</span>
            <span>🧱 <span id="brickCount">0</span></span>
        </div>

        <div class="canvas-wrapper">
            <canvas id="gameCanvas" touch-action="none"></canvas>
        </div>

        <!-- ===== 滑动条区域 ===== -->
        <div class="slider-wrapper">
            <div id="sliderTrack">
                <div id="sliderHandle"></div>
            </div>
        </div>

        <div class="bottom-bar">
            <button id="backHomeBtn" class="back-home-btn"><i class="fas fa-home"></i> 返回首页</button>
        </div>
    </div>

    <script src="utils.js"></script>
    <script src="wordData.js"></script>
    <script src="wordlistConfig.js"></script>
    <script src="brickBreaker.js"></script>

</body>

</html>
