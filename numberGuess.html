<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>猜数字</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(145deg, #1a472a 0%, #0e2a1a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Comic Neue', 'Comic Sans MS', cursive, sans-serif;
            padding: 20px;
        }

        .game-container {
            max-width: 720px;
            width: 100%;
            background: rgba(30, 50, 30, 0.7);
            backdrop-filter: blur(5px);
            border-radius: 60px;
            padding: 20px;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.3);
        }

        header {
            text-align: center;
            color: #FFE484;
            text-shadow: 4px 4px 0 #B45309;
            margin-bottom: 6px;
        }

        header h1 {
            font-size: 1.8rem;
            margin: 0;
        }

        header p {
            font-size: 0.8rem;
            opacity: 0.9;
            margin: 2px 0 0;
        }

        .top-panel {
            display: flex;
            justify-content: space-between;
            background: #31220e;
            padding: 4px 16px;
            border-radius: 50px;
            margin-bottom: 10px;
            color: #ffecb3;
            font-weight: bold;
            font-size: 0.85rem;
            flex-wrap: wrap;
            gap: 4px;
        }

        .top-panel .best-box {
            cursor: pointer;
            color: #ffd966;
        }

        .difficulty-bar {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .difficulty-btn {
            background: #ffbb33;
            border: none;
            padding: 4px 16px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            font-family: inherit;
            transition: 0.1s linear;
        }

        .difficulty-btn.active {
            background: #ff6b6b;
            color: white;
            box-shadow: 0 0 0 2px gold;
        }

        .difficulty-btn:active {
            transform: translateY(2px);
        }

        .game-layout {
            display: flex;
            gap: 16px;
            margin-top: 6px;
            min-height: 320px;
        }

        .history-panel {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            padding: 10px 12px;
            min-width: 0;
            max-height: 400px;
            overflow-y: auto;
            border: 2px solid rgba(255, 170, 51, 0.15);
        }

        .history-panel::-webkit-scrollbar {
            width: 3px;
        }

        .history-panel::-webkit-scrollbar-track {
            background: transparent;
        }

        .history-panel::-webkit-scrollbar-thumb {
            background: rgba(255, 170, 51, 0.3);
            border-radius: 10px;
        }

        .history-title {
            color: rgba(255, 236, 179, 0.5);
            font-size: 0.7rem;
            text-align: center;
            margin-bottom: 6px;
            letter-spacing: 2px;
        }

        .history-empty {
            color: rgba(255, 236, 179, 0.2);
            text-align: center;
            font-size: 0.75rem;
            padding: 20px 0;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 3px 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 0.85rem;
            color: #ffecb3;
        }

        .history-item .guess-num {
            font-weight: bold;
            font-family: monospace;
            font-size: 1.1rem;
            letter-spacing: 2px;
            color: #fff;
        }

        .history-item .guess-result {
            font-weight: bold;
            font-size: 0.9rem;
        }

        .history-item .guess-result .a {
            color: #4CAF50;
        }

        .history-item .guess-result .b {
            color: #ffaa33;
        }

        .input-panel {
            flex: 1.8;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 0;
        }

        .guess-display {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            padding: 12px 16px;
            text-align: center;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 2px solid rgba(255, 170, 51, 0.15);
            flex-wrap: wrap;
        }

        .guess-digit {
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(255, 255, 255, 0.08);
        }

        .guess-digit img {
            width: 70%;
            height: 70%;
            object-fit: contain;
        }

        .guess-digit.filled {
            border-color: #ffaa33;
        }

        .guess-digit .placeholder {
            color: rgba(255, 255, 255, 0.15);
            font-size: 1.2rem;
        }

        .numpad {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
        }

        .num-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 6px;
            cursor: pointer;
            transition: 0.05s linear;
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1 / 1;
        }

        .num-btn:active {
            transform: scale(0.92);
        }

        .num-btn img {
            width: 70%;
            height: 70%;
            object-fit: contain;
        }

        .num-btn.used {
            opacity: 0.2;
            pointer-events: none;
        }

        .num-btn.delete-btn {
            background: rgba(255, 0, 0, 0.1);
            border-color: rgba(255, 0, 0, 0.2);
            color: #ff6b6b;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .num-btn.delete-btn:active {
            background: rgba(255, 0, 0, 0.2);
        }

        .bottom-bar {
            text-align: center;
            margin-top: 10px;
        }

        .bottom-bar .back-home-btn {
            background: #607d8b;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 4px 0 #455a64;
            transition: 0.05s linear;
            font-size: 0.9rem;
        }

        .bottom-bar .back-home-btn:active {
            transform: translateY(3px);
            box-shadow: 0 0px 0 #455a64;
        }

        #startOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a472a 0%, #0e2a1a 100%);
            z-index: 100000;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
            text-align: center;
            padding: 20px;
        }

        #startOverlay h1 {
            font-size: 2.5rem;
            text-shadow: 4px 4px 0 #b45309;
            margin-bottom: 4px;
        }

        #startOverlay .subtitle {
            font-size: 1.1rem;
            opacity: 0.8;
            margin-bottom: 16px;
        }

        .rule-box {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 30px;
            padding: 12px 20px;
            margin-bottom: 20px;
            max-width: 400px;
            width: 90%;
        }

        .rule-box p {
            margin: 3px 0;
            font-size: 0.85rem;
            opacity: 0.9;
        }

        .rule-box .highlight {
            color: #ffd54f;
            font-weight: bold;
        }

        .rule-box .highlight-a {
            color: #4CAF50;
            font-weight: bold;
        }

        .rule-box .highlight-b {
            color: #ffaa33;
            font-weight: bold;
        }

        #startBtn {
            background: #ffaa33;
            border: none;
            padding: 12px 40px;
            font-size: 1.3rem;
            border-radius: 60px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 0 #b97f44;
            font-family: inherit;
            transition: 0.05s linear;
            color: #31220e;
        }

        #startBtn:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #b97f44;
        }

        .result-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 20000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .result-card {
            background: linear-gradient(135deg, #fff9ef, #ffe0b3);
            border-radius: 60px;
            padding: 30px 35px;
            text-align: center;
            max-width: 360px;
            width: 85%;
            border: 4px solid #ffaa33;
        }

        .result-card h2 {
            font-size: 2rem;
            margin: 0 0 6px;
            color: #31220e;
        }

        .result-card .final-guesses {
            font-size: 2.5rem;
            font-weight: bold;
            color: #ff6b6b;
            margin: 4px 0;
        }

        .result-card .final-label {
            font-size: 1rem;
            color: #5a4a2e;
        }

        .result-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .result-buttons button {
            border: none;
            padding: 8px 24px;
            font-size: 0.95rem;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 4px 0 #b97f44;
            transition: 0.05s linear;
        }

        .result-buttons button:active {
            transform: translateY(3px);
            box-shadow: 0 0px 0 #b97f44;
        }

        .result-buttons .btn-restart {
            background: #4caf50;
            color: white;
            box-shadow: 0 4px 0 #2e7d32;
        }

        .result-buttons .btn-home {
            background: #607d8b;
            color: white;
            box-shadow: 0 4px 0 #455a64;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .game-container {
                padding: 14px;
                border-radius: 40px;
            }

            header h1 {
                font-size: 1.4rem;
            }

            .game-layout {
                flex-direction: column;
            }

            .history-panel {
                max-height: 140px;
                min-height: 80px;
                order: 2;
            }

            .input-panel {
                order: 1;
            }

            .guess-digit {
                width: 36px;
                height: 36px;
            }

            .num-btn {
                padding: 4px;
            }

            .top-panel {
                font-size: 0.7rem;
                padding: 3px 12px;
            }

            .difficulty-btn {
                font-size: 0.75rem;
                padding: 3px 12px;
            }

            #startOverlay h1 {
                font-size: 1.8rem;
            }

            #startBtn {
                font-size: 1.1rem;
                padding: 10px 30px;
            }

            .rule-box {
                padding: 10px 14px;
            }

            .rule-box p {
                font-size: 0.75rem;
            }

            .result-card {
                padding: 22px;
            }

            .result-card h2 {
                font-size: 1.6rem;
            }

            .result-card .final-guesses {
                font-size: 2rem;
            }
        }

        @media (max-width: 400px) {
            .guess-digit {
                width: 30px;
                height: 30px;
            }

            .num-btn {
                padding: 3px;
            }

            .numpad {
                gap: 4px;
            }

            .history-item {
                font-size: 0.75rem;
            }
        }
    </style>
</head>

<body>

    <div id="startOverlay">
        <h1>🔢 猜数字</h1>
        <div class="subtitle">Guess the Number · A·B</div>

        <div class="rule-box">
            <p>🎯 猜一个 <span class="highlight">不重复</span> 的数字</p>
            <p>✅ <span class="highlight-a">A</span> = 数字对且位置对</p>
            <p>🟡 <span class="highlight-b">B</span> = 数字对但位置不对</p>
            <p style="margin-top:6px; font-size:0.75rem;">💡 例如 1234 → 1A2B</p>
        </div>

        <button id="startBtn">🔊 开始挑战</button>
    </div>

    <div class="game-container" id="gameContainer" style="display: none;">
        <header>
            <h1>🔢 猜数字</h1>
            <p>Guess the Number · A·B</p>
        </header>

        <div class="top-panel">
            <span>🎯 次数: <span id="guessCount">0</span></span>
            <span class="best-box" id="bestBox">🏆 最佳: <span id="bestDisplay">—</span></span>
        </div>

        <div class="difficulty-bar" id="difficultyBar">
            <button class="difficulty-btn" data-difficulty="easy">🐣 简单 (2位)</button>
            <button class="difficulty-btn active" data-difficulty="medium">⚡ 普通 (3位)</button>
            <button class="difficulty-btn" data-difficulty="hard">🔥 困难 (4位)</button>
        </div>

        <div class="game-layout">
            <div class="history-panel" id="historyPanel">
                <div class="history-title">📋 猜测历史</div>
                <div id="historyList">
                    <div class="history-empty">还没有猜测记录</div>
                </div>
            </div>

            <div class="input-panel">
                <div class="guess-display" id="guessDisplay"></div>
                <div class="numpad" id="numpad"></div>
            </div>
        </div>

        <div class="bottom-bar">
            <button id="backHomeBtn" class="back-home-btn"><i class="fas fa-home"></i> 返回首页</button>
        </div>
    </div>

    <script src="utils.js"></script>
    <script src="wordData.js"></script>
    <script src="wordlistConfig.js"></script>
    <script src="numberGuess.js"></script>

</body>

</html>
